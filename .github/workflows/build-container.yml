name: Build and publish container

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag or full commit SHA to build"
        required: true
        type: string
      release_channel:
        description: "Release channel used as Docker tag prefix"
        required: true
        type: choice
        options:
          - main
          - ai-agent

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/soundinfluencers-backend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate source ref and release channel
        id: release
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -Eeuo pipefail

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/feat/ai-agent:refs/remotes/origin/feat/ai-agent"

          built_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"

          case "$RELEASE_CHANNEL" in
            main)
              allowed_ref="origin/main"
              if [[ "$SOURCE_REF" == "feat/ai-agent" || "$SOURCE_REF" == "refs/heads/feat/ai-agent" ]]; then
                printf 'ERROR: source_ref %s cannot be published as main\n' "$SOURCE_REF" >&2
                exit 1
              fi
              ;;
            ai-agent)
              allowed_ref="origin/feat/ai-agent"
              if [[ "$SOURCE_REF" == "main" || "$SOURCE_REF" == "refs/heads/main" ]]; then
                printf 'ERROR: source_ref %s cannot be published as ai-agent\n' "$SOURCE_REF" >&2
                exit 1
              fi
              ;;
            *)
              printf 'ERROR: unsupported release channel: %s\n' "$RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac

          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            printf 'ERROR: abbreviated commit SHA is not allowed; use the full commit SHA\n' >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$built_sha" "$allowed_ref"; then
            printf 'ERROR: commit %s from source_ref is not in the history of %s\n' \
              "$built_sha" "$allowed_ref" >&2
            exit 1
          fi

          {
            printf 'built_sha=%s\n' "$built_sha"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'immutable_tag=%s-%s\n' "$RELEASE_CHANNEL" "$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.immutable_tag }}
            type=raw,value=${{ inputs.release_channel }}
          labels: |
            org.opencontainers.image.title=SoundInfluencers Backend
            org.opencontainers.image.description=Production API for SoundInfluencers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.built_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.immutable_tag }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write publication summary
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          BUILT_SHA: ${{ steps.release.outputs.built_sha }}
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable_tag }}
        run: |
          {
            printf '## Published container image\n\n'
            printf -- '- Repository: %s\n' "$GITHUB_REPOSITORY"
            printf -- '- Source ref: %s\n' "$SOURCE_REF"
            printf -- '- Commit SHA: %s\n' "$BUILT_SHA"
            printf -- '- Release channel: %s\n' "$RELEASE_CHANNEL"
            printf -- '- Image: %s\n' "$REGISTRY_IMAGE"
            printf -- '- Immutable tag: %s:%s\n' "$REGISTRY_IMAGE" "$IMMUTABLE_TAG"
            printf -- '- Branch alias: %s:%s\n' "$REGISTRY_IMAGE" "$RELEASE_CHANNEL"
          } >> "$GITHUB_STEP_SUMMARY"
